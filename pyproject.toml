[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stegolab"
version = "0.1.0"
description = "Local StegoLab application foundation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.4,<3",
    "pillow>=12.3,<13",
    "pyarrow>=25,<26",
    "pydantic>=2.10,<3",
    "pynacl>=1.6,<2",
    "reedsolo>=1.7,<2",
    "torch==2.14.0",
    "uvicorn>=0.34,<1",
]

[project.scripts]
stegolab = "backend_service.command_line:main"

[dependency-groups]
development = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend_service", "schemas"]

[tool.uv]
default-groups = ["development"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend_service", "schemas", "tests/backend"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
