[project]
name = "stegolab-cuda-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pynacl==1.6.2",
    "reedsolo==1.7.0",
    "torch==2.14.0+cu126",
    "uvicorn==0.53.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
constraint-dependencies = ["filelock==4.0.1"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
