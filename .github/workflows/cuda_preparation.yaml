name: Native CUDA image preparation

on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths:
      - "infrastructure/cuda/**"
      - "infrastructure/compose.gpu.yaml"
      - "backend_service/**"
      - "schemas/**"
      - "scripts/pilot_budget_dependencies.py"
      - "scripts/verify_cuda_image.py"
      - ".github/workflows/cuda_preparation.yaml"
  pull_request:
    paths:
      - "infrastructure/cuda/**"
      - "infrastructure/compose.gpu.yaml"
      - "backend_service/**"
      - "schemas/**"
      - "scripts/pilot_budget_dependencies.py"
      - "scripts/verify_cuda_image.py"
      - ".github/workflows/cuda_preparation.yaml"

permissions:
  contents: read

concurrency:
  group: cuda-preparation-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native_amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Confirm native builder and storage
        run: |
          test "$(uname -m)" = x86_64
          df -h .
          docker info --format '{{.Architecture}}'
      - name: Check CUDA dependency manifest
        run: python3 scripts/pilot_budget_dependencies.py --check
      - name: Build locked CUDA runtime without GPU access
        run: docker build --target cuda_runtime --file infrastructure/cuda/Dockerfile --tag stegolab-cuda:check .
      - name: Verify installed runtime and CPU execution
        run: |
          docker image inspect stegolab-cuda:check --format '{{.Architecture}} {{.Size}}'
          docker run --rm --network none --entrypoint python stegolab-cuda:check -m backend_service.command_line --help
          docker run --rm --network none --memory 7g --entrypoint python stegolab-cuda:check scripts/verify_cuda_image.py
          df -h .
